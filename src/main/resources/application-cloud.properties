# Perfil para la nube: sin Eureka; cada servicio se ubica por su URL pública (variables de entorno).
eureka.client.enabled=false
spring.cloud.discovery.client.simple.instances.auth-service[0].uri=${AUTH_URL}
spring.cloud.discovery.client.simple.instances.catalog-service[0].uri=${CATALOG_URL}
spring.cloud.discovery.client.simple.instances.sales-service[0].uri=${SALES_URL}
spring.cloud.discovery.client.simple.instances.design-service[0].uri=${DESIGN_URL}
spring.cloud.discovery.client.simple.instances.production-service[0].uri=${PRODUCTION_URL}
spring.cloud.discovery.client.simple.instances.inventory-service[0].uri=${INVENTORY_URL}
spring.cloud.discovery.client.simple.instances.notification-service[0].uri=${NOTIFICATION_URL}
spring.cloud.discovery.client.simple.instances.report-service[0].uri=${REPORT_URL}
