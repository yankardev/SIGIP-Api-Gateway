spring.application.name=api-gateway
server.port=${PORT:8090}

# --- Rutas: punto único de entrada. lb:// resuelve las instancias registradas en Eureka y
# reparte la carga entre ellas (Spring Cloud LoadBalancer, round robin). ---
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth-service/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[1].id=catalog-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://catalog-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/catalog-service/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[2].id=sales-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://sales-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/sales-service/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[3].id=design-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://design-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/design-service/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[4].id=production-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://production-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/production-service/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[5].id=inventory-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://inventory-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/inventory-service/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[6].id=notification-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/notification-service/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[7].id=report-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://report-service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/report-service/**
spring.cloud.gateway.server.webflux.routes[7].filters[0]=StripPrefix=1

# --- CORS para el frontend (Angular en local y el dominio publicado) ---
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origin-patterns=${CORS_ORIGINS:http://localhost:4200}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600

# --- Descubrimiento y monitoreo ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus,gateway
management.endpoint.health.probes.enabled=true
