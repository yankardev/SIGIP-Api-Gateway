spring.application.name=sigip-api-gateway
server.port=${PORT:8090}

# Eureka discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Gateway discovery locator (service IDs in lowercase)
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Explicit routes to preserve the API paths consumed by the frontend
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://sigip-auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=catalog-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://sigip-catalog-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/catalogo/**

spring.cloud.gateway.server.webflux.routes[2].id=sales-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://sigip-sales-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/pedidos/**,/api/pagos/**

spring.cloud.gateway.server.webflux.routes[3].id=design-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://sigip-design-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/disenos/**

spring.cloud.gateway.server.webflux.routes[4].id=production-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://sigip-production-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/produccion/**

spring.cloud.gateway.server.webflux.routes[5].id=inventory-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://sigip-inventory-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/inventario/**

spring.cloud.gateway.server.webflux.routes[6].id=notification-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://sigip-notification-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/notificaciones/**

spring.cloud.gateway.server.webflux.routes[7].id=report-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://sigip-report-service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/reportes/**

# CORS for Angular frontend
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origin-patterns=${CORS_ORIGINS:http://localhost:4200}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600

# Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus,gateway
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

info.app.name=SIGIP API Gateway
info.app.description=Punto de entrada y enrutamiento de microservicios SIGIP
info.app.version=0.0.1
