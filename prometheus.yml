global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: sigip-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:9002']

  - job_name: sigip-auth
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:9003']

  - job_name: sigip-catalog
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['catalog-service:9004']

  - job_name: sigip-design
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['design-service:9005']

  - job_name: sigip-inventory
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['inventory-service:9006']

  - job_name: sigip-production
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['production-service:9007']

  - job_name: sigip-sales
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['sales-service:9008']

  - job_name: sigip-report
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['report-service:9009']

  - job_name: sigip-notification
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['notification-service:9010']
