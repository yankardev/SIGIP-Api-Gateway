name: SIGIP deployment validation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compose-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Gateway
        uses: actions/checkout@v4
        with:
          path: SIGIP-Api-Gateway

      - name: Common
        uses: actions/checkout@v4
        with:
          repository: yankardev/SIGIP-Common
          path: SIGIP-Common

      - name: Discovery
        uses: actions/checkout@v4
        with:
          repository: yankardev/SIGIP-Discovery-Server
          path: SIGIP-Discovery-Server

      - name: Auth
        uses: actions/checkout@v4
        with:
          repository: yankardev/SIGIP-Auth-Service
          path: SIGIP-Auth-Service

      - name: Catalog
        uses: actions/checkout@v4
        with:
          repository: yankardev/SIGIP-Catalog-Service
          path: SIGIP-Catalog-Service

      - name: Design
        uses: actions/checkout@v4
        with:
          repository: yankardev/SIGIP-Design-Service
          path: SIGIP-Design-Service

      - name: Inventory
        uses: actions/checkout@v4
        with:
          repository: yankardev/SIGIP-Inventory-Service
          path: SIGIP-Inventory-Service

      - name: Production
        uses: actions/checkout@v4
        with:
          repository: yankardev/SIGIP-Production-Service
          path: SIGIP-Production-Service

      - name: Sales
        uses: actions/checkout@v4
        with:
          repository: yankardev/SIGIP-Sales-Service
          path: SIGIP-Sales-Service

      - name: Report
        uses: actions/checkout@v4
        with:
          repository: yankardev/SIGIP-Report-Service
          path: SIGIP-Report-Service

      - name: Notification
        uses: actions/checkout@v4
        with:
          repository: yankardev/SIGIP-Notification-Service
          path: SIGIP-Notification-Service

      - name: Frontend
        uses: actions/checkout@v4
        with:
          repository: yankardev/SIGIP-Frontend
          path: SIGIP-Frontend

      - name: Validate Compose
        working-directory: SIGIP-Api-Gateway
        run: |
          cp .env.example .env
          docker compose -f docker-compose.full.yml config --quiet

      - name: Build complete SIGIP stack
        working-directory: SIGIP-Api-Gateway
        env:
          COMPOSE_PARALLEL_LIMIT: 2
        run: docker compose -f docker-compose.full.yml build

      - name: Start MySQL, RabbitMQ and all SIGIP services
        working-directory: SIGIP-Api-Gateway
        run: docker compose -f docker-compose.full.yml up -d --wait --wait-timeout 600

      - name: Verify routes, authentication, CRUD and RabbitMQ events
        working-directory: SIGIP-Api-Gateway
        run: python3 scripts/smoke-test.py --write-test-data

      - name: Container diagnostics
        if: always()
        working-directory: SIGIP-Api-Gateway
        run: |
          docker compose -f docker-compose.full.yml ps -a
          docker compose -f docker-compose.full.yml logs --no-color --tail=100

      - name: Stop disposable CI stack
        if: always()
        working-directory: SIGIP-Api-Gateway
        run: docker compose -f docker-compose.full.yml down -v
